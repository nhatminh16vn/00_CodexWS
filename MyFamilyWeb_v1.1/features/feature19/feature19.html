<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ ca-rô</title>
    <link rel="stylesheet" href="../../css/home-link.css">
    <link rel="stylesheet" href="../../css/family-games.css?v=2">
</head>
<body class="mini-game-page" style="--game-accent:#008c82">
    <a href="../../index.html" class="home-link">Trang chủ</a>
    <main class="mini-game">
        <header class="game-heading"><h1>Cờ ca-rô</h1><p>Chơi với máy hoặc thay phiên cùng bạn.</p></header>
        <div class="tic-settings">
            <label>Chế độ
                <select id="mode" class="game-input">
                    <option value="ai">Đấu với máy</option>
                    <option value="two-player">Hai người chơi</option>
                </select>
            </label>
            <label id="difficulty-setting">Độ khó máy
                <select id="difficulty" class="game-input">
                    <option value="easy">Dễ</option>
                    <option value="medium" selected>Vừa</option>
                    <option value="hard">Khó</option>
                </select>
            </label>
        </div>
        <p class="game-status" id="status" role="status" aria-live="polite">Lượt của X</p>
        <div class="tic-grid game-board" id="board" aria-label="Bàn cờ ca-rô"></div>
        <div class="game-actions"><button class="game-button" id="restart" type="button">Ván mới</button></div>
    </main>
    <script src="../../js/game-audio.js"></script><script src="feature19.js"></script><script src="../../js/site-music.js"></script>
</body>
</html>
