<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-feature-i18n="tttTitle">Cờ ca-rô</title>
    <link rel="stylesheet" href="../../css/home-link.css">
    <link rel="stylesheet" href="../../css/family-games.css?v=2">
</head>
<body class="mini-game-page" style="--game-accent:#008c82">
    <a href="../../index.html" class="home-link">Trang chủ</a>
    <main class="mini-game">
        <header class="game-heading"><h1 data-feature-i18n="tttTitle">Cờ ca-rô</h1><p data-feature-i18n="tttDesc">Chơi với máy hoặc thay phiên cùng bạn.</p></header>
        <div class="tic-settings">
            <label><span data-feature-i18n="mode">Chế độ</span>
                <select id="mode" class="game-input">
                    <option value="ai" data-feature-i18n="vsComputer">Đấu với máy</option>
                    <option value="two-player" data-feature-i18n="twoPlayers">Hai người chơi</option>
                </select>
            </label>
            <label id="difficulty-setting"><span data-feature-i18n="difficulty">Độ khó máy</span>
                <select id="difficulty" class="game-input">
                    <option value="easy" data-feature-i18n="easy">Dễ</option>
                    <option value="medium" selected data-feature-i18n="medium">Vừa</option>
                    <option value="hard" data-feature-i18n="hard">Khó</option>
                </select>
            </label>
        </div>
        <p class="game-status" id="status" role="status" aria-live="polite" data-feature-i18n="turn" data-feature-i18n-vars='{"p":"X"}'>Lượt của X</p>
        <div class="tic-grid game-board" id="board" aria-label="Bàn cờ ca-rô" data-feature-i18n-aria="ticBoardAria"></div>
        <div class="game-actions"><button class="game-button" id="restart" type="button" data-feature-i18n="newGame">Ván mới</button></div>
    </main>
    <script src="../../js/utils/feature-i18n.js"></script><script src="../../js/game-audio.js"></script><script src="feature19.js"></script><script src="../../js/site-music.js"></script>
</body>
</html>
