<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="mini-game-page" style="--game-accent:#d45138">

        <div class="mole-grid game-board" id="mole-grid"></div>
