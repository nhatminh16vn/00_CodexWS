<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-feature-i18n="hiraganaBallTitle">Hiragana Ball</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="feature4.css">
</head>

<body>
    <a href="../../index.html" class="home-link">Trang chủ</a>
    <div class="game-container">
        <h1 data-feature-i18n="hiraganaBallTitle">Hiragana Ball Challenge</h1>

        <div class="game-info">
            <div class="timer"><span data-feature-i18n="timeLabel">Time</span>: <span id="time">30</span>s</div>
            <div class="score"><span data-feature-i18n="score">Score</span>: <span id="score">0</span></div>
            <div class="mistakes"><span data-feature-i18n="mistakes">Mistakes</span>: <span id="mistakes">0/3</span></div>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <!-- Thêm hiển thị romaji -->
        <div class="romaji-display"><span data-feature-i18n="romaji">Romaji:</span> <span id="romaji"></span></div>

        <div class="hiragana-board" id="hiraganaBoard"></div>

        <div class="ball-container">
            <div class="ball" id="ball" draggable="true">?</div>
        </div>

        <div class="message" id="message" data-feature-i18n="dragMatch">Drag the ball to the matching Hiragana</div>
    </div>

    <div class="game-over" id="gameOver" style="display: none;">
        <h2 data-feature-i18n="gameOver">Game Over!</h2>
        <p><span data-feature-i18n="finalScore">Final Score:</span> <span id="finalScore">0</span></p>
        <p><span data-feature-i18n="levelReached">Level Reached:</span> <span id="finalLevel">1</span></p>
        <button id="restartButton" data-feature-i18n="playAgain">Play Again</button>
    </div>

    <!-- Liên kết đến JavaScript chính và feature -->
    <script src="../../js/utils/feature-i18n.js"></script>
    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/app.js"></script>
    <script src="feature4.js"></script>
    <script src="../../js/site-music.js"></script>
</body>

</html>
