<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Chatbot</title>
    <link rel="stylesheet" href="feature9.css">
    <link rel="stylesheet" href="../../css/home-link.css">
</head>

<body>
    <a href="../../index.html" class="home-link">Trang chủ</a>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Family Chatbot</h1>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                <div>Hi! I'm your family chatbot. I can:</div>
                <ul>
                    <li>Answer questions</li>
                    <li>Solve math problems</li>
                    <li>Help with study and tech topics</li>
                    <li>Recommend books, jokes, and ideas</li>
                </ul>
                <div class="suggestions">
                    <div class="suggestion" onclick="quickQuestion('What can you do?')">Ask me</div>
                    <div class="suggestion" onclick="quickQuestion('Calculate 15 + 27')">Math</div>
                    <div class="suggestion" onclick="quickQuestion('Teach me Japanese')">Study</div>
                </div>
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Ask me anything...">
            <button id="send-button">Send</button>
        </div>
    </div>
    <script src="feature9.js"></script>
    <script src="../../js/site-music.js"></script>
</body>

</html>
