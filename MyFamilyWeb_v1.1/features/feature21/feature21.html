<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-feature-i18n="simonTitle">Nhớ giai điệu</title>
    <link rel="stylesheet" href="../../css/home-link.css">
    <link rel="stylesheet" href="../../css/family-games.css?v=2">
</head>
<body class="mini-game-page" style="--game-accent:#2957a4">
    <a href="../../index.html" class="home-link">Trang chủ</a>
    <main class="mini-game">
        <header class="game-heading"><h1 data-feature-i18n="simonTitle">Nhớ giai điệu</h1><p data-feature-i18n="simonDesc">Nghe chuỗi màu rồi lặp lại theo đúng thứ tự.</p></header>
        <p class="game-status" id="status" role="status" aria-live="polite" data-feature-i18n="simonReady">Bắt đầu để nghe chuỗi đầu tiên.</p>
        <div class="simon-grid game-board" id="simon-grid" aria-label="Bốn nút màu" data-feature-i18n-aria="simonAria"></div>
        <div class="game-stats"><span data-feature-i18n="sequence">Chuỗi</span>: <b id="level">0</b></div>
        <div class="game-actions"><button class="game-button" id="start" type="button" data-feature-i18n="start">Bắt đầu</button></div>
    </main>
    <script src="../../js/utils/feature-i18n.js"></script><script src="../../js/game-audio.js"></script><script src="feature21.js"></script><script src="../../js/site-music.js"></script>
</body>
</html>
