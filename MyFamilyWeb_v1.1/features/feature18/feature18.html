<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-feature-i18n="memoryTitle">Lật thẻ tìm cặp</title>
    <link rel="stylesheet" href="../../css/home-link.css">
    <link rel="stylesheet" href="../../css/family-games.css?v=2">
</head>
<body class="mini-game-page" style="--game-accent:#7553e6">
    <a href="../../index.html" class="home-link">Trang chủ</a>
    <main class="mini-game">
        <header class="game-heading"><h1 data-feature-i18n="memoryTitle">Lật thẻ tìm cặp</h1><p data-feature-i18n="memoryDesc">Tìm đủ 8 cặp hình giống nhau.</p></header>
        <div class="game-stats"><span><span data-feature-i18n="moves">Lượt lật</span>: <b id="moves">0</b></span><span><span data-feature-i18n="pairs">Cặp tìm được</span>: <b id="pairs">0</b>/8</span></div>
        <p class="game-status" id="status" role="status" aria-live="polite" data-feature-i18n="memoryHint">Chọn hai thẻ để bắt đầu.</p>
        <div class="memory-grid game-board" id="memory-grid"></div>
        <div class="game-actions"><button class="game-button" id="restart" type="button" data-feature-i18n="replay">Chơi lại</button></div>
    </main>
    <script src="../../js/utils/feature-i18n.js"></script><script src="../../js/game-audio.js"></script><script src="feature18.js"></script><script src="../../js/site-music.js"></script>
</body>
</html>
