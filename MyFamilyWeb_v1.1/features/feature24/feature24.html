<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử thách bong bóng</title>
    <link rel="stylesheet" href="../../css/home-link.css">
    <link rel="stylesheet" href="../../css/family-games.css?v=2">
</head>
<body class="mini-game-page" style="--game-accent:#247aa7">
    <a href="../../index.html" class="home-link">Trang chủ</a>
    <main class="mini-game">
        <header class="game-heading"><h1>Thử thách bong bóng</h1><p>Chạm bong bóng trước khi chúng bay khỏi màn hình.</p></header>
        <div class="game-stats"><span>Điểm: <b id="score">0</b></span><span>Thời gian: <b id="time">30</b>s</span></div>
        <div class="bubble-field" id="bubble-field" aria-label="Khu vực bong bóng"></div>
        <p class="game-status" id="status" role="status" aria-live="polite">Bắt đầu để chơi.</p>
        <div class="game-actions"><button class="game-button" id="start" type="button">Bắt đầu</button></div>
    </main>
    <script src="../../js/game-audio.js"></script><script src="feature24.js"></script><script src="../../js/site-music.js"></script>
</body>
</html>
