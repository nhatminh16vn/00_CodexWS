<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-feature-i18n="bubbleTitle">Thử thách bong bóng</title>
    <link rel="stylesheet" href="../../css/home-link.css">
    <link rel="stylesheet" href="../../css/family-games.css?v=2">
</head>
<body class="mini-game-page" style="--game-accent:#247aa7">
    <a href="../../index.html" class="home-link">Trang chủ</a>
    <main class="mini-game">
        <header class="game-heading"><h1 data-feature-i18n="bubbleTitle">Thử thách bong bóng</h1><p data-feature-i18n="bubbleDesc">Chạm bong bóng trước khi chúng bay khỏi màn hình.</p></header>
        <div class="game-stats"><span><span data-feature-i18n="score">Điểm</span>: <b id="score">0</b></span><span><span data-feature-i18n="time">Thời gian</span>: <b id="time">30</b>s</span></div>
        <div class="bubble-field" id="bubble-field" aria-label="Khu vực bong bóng" data-feature-i18n-aria="bubbleField"></div>
        <p class="game-status" id="status" role="status" aria-live="polite" data-feature-i18n="bubbleReady">Bắt đầu để chơi.</p>
        <div class="game-actions"><button class="game-button" id="start" type="button" data-feature-i18n="start">Bắt đầu</button></div>
    </main>
    <script src="../../js/utils/feature-i18n.js"></script><script src="../../js/game-audio.js"></script><script src="feature24.js"></script><script src="../../js/site-music.js"></script>
</body>
</html>
