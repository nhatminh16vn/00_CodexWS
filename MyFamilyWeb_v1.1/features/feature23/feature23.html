<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử thách màu sắc</title>
    <link rel="stylesheet" href="../../css/home-link.css">
    <link rel="stylesheet" href="../../css/family-games.css?v=2">
</head>
<body class="mini-game-page" style="--game-accent:#bb3863">
    <a href="../../index.html" class="home-link">Trang chủ</a>
    <main class="mini-game">
        <header class="game-heading"><h1>Thử thách màu sắc</h1><p>Chọn màu mực của chữ, đừng chọn nội dung chữ.</p></header>
        <div class="game-stats"><span>Điểm: <b id="score">0</b></span><span>Còn lại: <b id="remaining">20</b></span></div>
        <p class="color-prompt" id="prompt" aria-live="polite">Sẵn sàng?</p>
        <div class="color-choices" id="choices"></div>
        <p class="game-status" id="status" role="status" aria-live="polite">Bắt đầu thử thách.</p>
        <div class="game-actions"><button class="game-button" id="start" type="button">Bắt đầu</button></div>
    </main>
    <script src="../../js/game-audio.js"></script><script src="feature23.js"></script><script src="../../js/site-music.js"></script>
</body>
</html>
